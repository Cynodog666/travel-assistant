<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f6f2ea">
    <title>坤坤 · 旅行管家</title>
    <style>
        :root {
            --paper: #f6f2ea;
            --card: #fffdf9;
            --ink: #26231f;
            --ink-soft: #47423a;
            --muted: #8d857a;
            --line: #e4dcd0;
            --accent: #9c3f2f;
            --accent-soft: #f4e5df;
            --shadow: 0 1px 2px rgba(38, 35, 31, 0.04), 0 8px 24px rgba(38, 35, 31, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            background: var(--paper);
            /* 纸面质感：两层极淡的径向光，不引外部图片 */
            background-image:
                radial-gradient(120% 80% at 12% 0%, #fffdf8 0%, rgba(255, 253, 248, 0) 55%),
                radial-gradient(90% 60% at 100% 100%, #f1ece2 0%, rgba(241, 236, 226, 0) 60%);
            color: var(--ink);
            font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        .serif {
            font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
        }

        /* ============ 启动页 ============ */
        .splash-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--paper);
            background-image:
                radial-gradient(120% 80% at 20% 10%, #fffdf8 0%, rgba(255, 253, 248, 0) 60%);
            opacity: 1;
        }

        .splash-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            animation: splashIn 0.9s ease-out both;
        }

        .splash-line {
            font-size: 14px;
            letter-spacing: 0.14em;
            color: var(--muted);
        }

        @keyframes splashIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 印章：整个界面的视觉锚点，也是品牌记号 */
        .seal {
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            display: grid;
            place-items: center;
            border-radius: 6px;
            background: var(--accent);
            color: #fdf6f2;
            font-family: "Songti SC", "STSong", "SimSun", serif;
            font-size: 20px;
            line-height: 1;
            letter-spacing: 0;
            box-shadow: 0 2px 8px rgba(156, 63, 47, 0.18);
        }

        .seal--lg {
            width: 64px;
            height: 64px;
            flex-basis: 64px;
            font-size: 34px;
            border-radius: 10px;
        }

        /* ============ 主体 ============ */
        .app {
            height: 100vh;
            height: 100dvh;
            max-width: 780px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.6s ease-out both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 2px 16px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand h1 {
            font-size: 15.5px;
            font-weight: 600;
            letter-spacing: 0.04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand p {
            margin-top: 3px;
            font-size: 11.5px;
            color: var(--muted);
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 0 0 auto;
        }

        .ghost {
            padding: 6px 9px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--muted);
            font-size: 12.5px;
            font-family: inherit;
            cursor: pointer;
            transition: color 0.18s ease, background 0.18s ease;
        }

        .ghost:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }

        .ghost:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: transparent;
            color: var(--muted);
        }

        /* 对话区：min-height:0 是移动端能正常滚动收缩的关键 */
        .chat-container {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 22px 2px 18px;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #ded5c6;
            border-radius: 8px;
        }

        /* 开场白：不是气泡，是一段引文 */
        .greeting {
            max-width: 34em;
            padding: 16px 18px;
            border-left: 2px solid var(--accent);
            border-radius: 0 10px 10px 0;
            background: var(--card);
            color: #35312b;
            font-size: 15.5px;
            line-height: 2.05;
            letter-spacing: 0.02em;
            box-shadow: var(--shadow);
        }

        .message {
            max-width: 76%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14.5px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
            animation: bubbleIn 0.24s ease-out both;
        }

        /* 空会话的建议问题：点一下填进输入框，不自动发送 */
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-width: 34em;
        }

        .chip {
            padding: 7px 12px;
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            font-size: 12.5px;
            font-family: inherit;
            line-height: 1.4;
            text-align: left;
            cursor: pointer;
            transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
        }

        .chip:hover {
            color: var(--accent);
            border-color: #dcc0b6;
            background: var(--accent-soft);
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: var(--accent);
            color: #fff8f4;
            border-bottom-right-radius: 4px;
            box-shadow: 0 6px 18px rgba(156, 63, 47, 0.16);
        }

        .ai-message {
            align-self: flex-start;
            background: var(--card);
            color: var(--ink-soft);
            border: 1px solid var(--line);
            border-bottom-left-radius: 4px;
        }

        .typing {
            display: flex;
            gap: 7px;
            align-self: flex-start;
            padding: 14px 18px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            border-bottom-left-radius: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #c9b9a7;
            animation: typing 1.3s infinite ease-in-out both;
        }

        .dot:nth-child(2) { animation-delay: -0.22s; }
        .dot:nth-child(3) { animation-delay: -0.44s; }

        @keyframes typing {
            0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-2px); }
        }

        /* ============ 输入区 ============ */
        .composer {
            flex: 0 0 auto;
            padding: 12px 0 calc(14px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--line);
        }

        .field {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 6px 6px 6px 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .field:focus-within {
            border-color: #d8bdb2;
            box-shadow: 0 0 0 3px rgba(156, 63, 47, 0.06);
        }

        #message-input {
            flex: 1;
            min-width: 0;
            padding: 10px 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--ink);
            font-size: 15px;
            font-family: inherit;
            line-height: 1.65;
            resize: none;
            max-height: 150px;
        }

        #message-input::placeholder {
            color: #b3a89b;
        }

        #send-button {
            flex: 0 0 auto;
            width: 62px;
            height: 40px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: #fff8f4;
            font-size: 13.5px;
            font-family: inherit;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: background 0.18s ease, transform 0.18s ease;
        }

        #send-button:hover:not(:disabled) {
            background: #89362a;
        }

        #send-button:active:not(:disabled) {
            transform: scale(0.97);
        }

        #send-button:disabled {
            background: #d9cec0;
            color: #fbf7f2;
            cursor: not-allowed;
        }

        .hint {
            margin-top: 9px;
            padding-left: 2px;
            font-size: 11.5px;
            line-height: 1.7;
            color: var(--muted);
        }

        /* ============ 回答里的链接 / 地图 ============ */
        .inline-link {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid rgba(156, 63, 47, 0.35);
            word-break: break-all;
        }

        .inline-link:hover {
            border-bottom-color: var(--accent);
        }

        .chat-map {
            display: block;
            width: 100%;
            max-width: 100%;
            margin: 10px 0;
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        /* ============ 结构化卡片 ============ */
        .chat-card {
            align-self: stretch;
            margin: 2px 0;
            padding: 12px 14px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
            font-size: 13px;
            animation: bubbleIn 0.24s ease-out both;
        }

        .chat-card-head {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--ink);
        }

        .chat-card-sub {
            font-size: 11.5px;
            font-weight: 400;
            color: var(--muted);
        }

        .chat-card-body {
            display: flex;
            flex-direction: column;
        }

        .chat-card-row {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 10px;
            padding: 8px 0;
            border-top: 1px solid #f0eae0;
            color: var(--ink-soft);
        }

        .chat-card-row:first-child {
            border-top: 0;
        }

        .chat-card-strong {
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.02em;
        }

        .chat-card-muted {
            font-size: 12px;
            color: var(--muted);
        }

        .chat-card-badge {
            padding: 1px 7px;
            border-radius: 999px;
            font-size: 11px;
            color: #7d7466;
            background: #f1ece2;
        }

        .chat-card-badge--fast {
            color: #a34a2c;
            background: #f7e6dc;
        }

        .chat-card-arrow {
            color: #b9ad9d;
        }

        .chat-card-price {
            margin-left: auto;
            font-weight: 600;
            color: var(--accent);
            white-space: nowrap;
        }

        .chat-card-soldout {
            margin-left: auto;
            font-weight: 600;
            color: #9b3b3b;
            white-space: nowrap;
        }

        .chat-card-footer {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #f0eae0;
            font-size: 11.5px;
            color: var(--muted);
        }

        /* ============ 令牌层 ============ */
        .token-gate {
            position: fixed;
            inset: 0;
            z-index: 1200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--paper);
            background-image: radial-gradient(120% 80% at 20% 10%, #fffdf8 0%, rgba(255, 253, 248, 0) 60%);
        }

        .token-card {
            width: min(400px, 100%);
            padding: 30px 26px 24px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(38, 35, 31, 0.12);
        }

        .token-card .seal {
            margin-bottom: 16px;
        }

        .token-card h2 {
            margin-bottom: 10px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .token-card p {
            margin-bottom: 18px;
            font-size: 12.5px;
            line-height: 1.8;
            color: var(--muted);
        }

        #token-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fdfbf7;
            color: var(--ink);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        #token-input:focus {
            border-color: #d8bdb2;
            box-shadow: 0 0 0 3px rgba(156, 63, 47, 0.06);
        }

        .token-error {
            min-height: 18px;
            margin-top: 8px;
            font-size: 12px;
            color: var(--accent);
        }

        .token-btn {
            width: 100%;
            height: 42px;
            margin-top: 4px;
            border: 0;
            border-radius: 10px;
            background: var(--accent);
            color: #fff8f4;
            font-size: 14px;
            font-family: inherit;
            letter-spacing: 0.08em;
            cursor: pointer;
        }

        .token-btn:hover {
            background: #89362a;
        }

        .token-btn:disabled {
            background: #d9cec0;
            color: #fbf7f2;
            cursor: not-allowed;
        }

        /* ============ 轻提示 ============ */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 92px;
            z-index: 1100;
            max-width: 80vw;
            padding: 9px 16px;
            border-radius: 999px;
            background: rgba(38, 35, 31, 0.9);
            color: #fbf7f2;
            font-size: 12.5px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(10px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============ 平板 ============ */
        @media (max-width: 780px) {
            .app { padding: 0 16px; }
        }

        /* ============ 手机 ============ */
        @media (max-width: 560px) {
            .app { padding: 0 13px; }

            .topbar {
                padding: 12px 0 11px;
                gap: 8px;
            }

            .seal {
                width: 32px;
                height: 32px;
                flex-basis: 32px;
                font-size: 17px;
                border-radius: 5px;
            }

            .brand { gap: 9px; }

            .brand h1 { font-size: 14.5px; }

            .brand p {
                font-size: 10.5px;
                /* 窄屏优先保住标题，副标题最多一行省略 */
                max-width: 42vw;
            }

            .ghost {
                padding: 6px 7px;
                font-size: 12px;
            }

            .chat-container {
                gap: 11px;
                padding: 16px 0 14px;
            }

            .greeting {
                padding: 14px 15px;
                font-size: 14.5px;
                line-height: 1.95;
                letter-spacing: 0.01em;
            }

            .message {
                max-width: 88%;
                padding: 11px 14px;
                font-size: 14px;
                line-height: 1.75;
            }

            .chips {
                gap: 7px;
            }

            .chip {
                padding: 6px 10px;
                font-size: 12px;
            }

            .composer {
                padding: 10px 0 calc(12px + env(safe-area-inset-bottom));
            }

            .field {
                padding: 5px 5px 5px 13px;
                border-radius: 14px;
            }

            /* iOS 输入框 <16px 会触发页面自动放大 */
            #message-input {
                font-size: 16px;
                padding: 9px 0;
                line-height: 1.55;
            }

            #send-button {
                width: 60px;
                height: 40px;
                font-size: 13px;
            }

            .hint {
                margin-top: 8px;
                font-size: 11px;
                line-height: 1.6;
            }

            .chat-card {
                padding: 11px 12px;
                font-size: 12.5px;
            }

            .chat-card-row {
                gap: 3px 8px;
                padding: 7px 0;
            }

            .chat-card-price,
            .chat-card-soldout {
                margin-left: 0;
                width: 100%;
                padding-top: 3px;
            }

            .token-card {
                padding: 24px 20px 20px;
            }
        }

        /* 超窄屏：让卡片的次要信息换行，不横向溢出 */
        @media (max-width: 380px) {
            .brand p { display: none; }
            .chat-card-muted { font-size: 11.5px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="splash-screen" id="splash-screen">
        <div class="splash-inner">
            <div class="seal seal--lg">坤</div>
            <div class="splash-line serif">浮生多碌，当赴烟霞</div>
        </div>
    </div>

    <div class="token-gate" id="token-gate" style="display: none;">
        <div class="token-card">
            <div class="seal">坤</div>
            <h2>输入演示口令</h2>
            <p>这台服务器开了访问保护，口令只保存在本机浏览器，不会上传。</p>
            <input id="token-input" type="password" name="demo-access-token" placeholder="演示口令"
                   autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false">
            <div class="token-error" id="token-error"></div>
            <button class="token-btn" id="token-submit" type="button">进入</button>
        </div>
    </div>

    <main class="app" id="main-container" style="display: none;">
        <header class="topbar">
            <div class="brand">
                <span class="seal">坤</span>
                <div>
                    <h1>坤坤 · 旅行管家</h1>
                    <p>查得到的数据，才敢写进行程</p>
                </div>
            </div>
            <div class="top-actions">
                <button id="clear-button" class="ghost" type="button">清空</button>
                <button id="save-button" class="ghost" type="button">保存记录</button>
            </div>
        </header>

        <section class="chat-container" id="chat-container">
            <div class="greeting serif" id="welcome-message"></div>
        </section>

        <footer class="composer">
            <div class="field">
                <textarea id="message-input" rows="1" placeholder="想去哪、玩几天？"></textarea>
                <button id="send-button" type="button">发送</button>
            </div>
            <div class="hint">路线、天气、火车票、航班都由真实接口查询；查不到会直说没查到。</div>
        </footer>
    </main>

    <div class="toast" id="toast"></div>

    <script src="/app.js?v=20261127d"></script>
</body>
</html>
